<div class="min-h-dvh bg-slate-100 text-slate-900">
  <header class="mx-auto max-w-5xl px-6 pt-8">
    <button
      type="button"
      class="-ml-2 grid size-10 place-items-center rounded-full text-slate-700 transition hover:bg-slate-200 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900"
      aria-label="Go back"
      title="Go back"
      (click)="goBack()"
    >
      <svg lucideArrowLeft class="size-5 cursor-pointer" aria-hidden="true"></svg>
    </button>
  </header>

  <main class="mx-auto max-w-5xl px-6 pt-6 pb-16 sm:pt-10">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Choose a curriculum</h1>
    <p class="mt-2 text-slate-600">Select the programme whose results you want to analyse.</p>

    <ul class="mt-9 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (c of curricula; track c.slug) {
        <li>
          @if (c.available) {
            <a
              [routerLink]="['/', c.slug, 'overview']"
              class="group flex h-full flex-col rounded-2xl border-2 border-emerald-600/80 bg-white p-7 transition hover:shadow-lg focus-visible:ring-4 focus-visible:ring-emerald-600/30 focus-visible:outline-none"
            >

              <ng-container *ngTemplateOutlet="card; context: { $implicit: c }"></ng-container>
              <span
                class="mt-auto pt-4 text-sm font-semibold text-emerald-800 group-hover:underline"
                >Open dashboard</span
              >
            </a>
          } @else {
            <div
              class="flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-7"
              aria-disabled="true"
            >
              <ng-container *ngTemplateOutlet="card; context: { $implicit: c }"></ng-container>
            </div>
          }
        </li>
      }
    </ul>

    <!-- <p class="mt-8 text-sm text-slate-500">
      Curricula shown depend on the access granted to your account.
    </p> -->
  </main>
</div>

<ng-template #card let-c>
  <span
    class="w-fit rounded-full px-2.5 py-0.5 text-xs font-semibold"
    [class]="c.available ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-slate-700'"
    >{{ c.available ? 'Available' : 'Coming soon' }}</span
  >

  <span
    class="mt-3 grid size-28 place-items-center rounded-full font-bold text-white"
    [class]="c.mark.class"
    aria-hidden="true"
    ><img
    class="mt-1 h-24 w-24 rounded-full object-cover"
    [src]="c.imageUrl"
    [alt]="c.name"
  /></span
  >
  <h2 class="mt-5 text-3xl font-semibold">{{ c.name }}</h2>
  <p class="mt-3 text-slate-600">{{ c.description }}</p>
</ng-template>
